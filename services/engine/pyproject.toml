[project]
name = "cronista"
version = "0.1.0"
description = "Engine do Cronista: ingestão, análise e montagem de gameplays gravadas no OBS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
]

[project.scripts]
cronista = "cronista.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cronista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not media'"
markers = [
    "gpu: exige GPU (roda só em prod)",
    "media: exige mídia real (roda só em prod)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["src/cronista/db/migrations/versions/"]
